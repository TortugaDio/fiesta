<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e32820">
  <meta name="description" content="Invitación al cumpleaños de 2 años de Emyr, el 26 de septiembre de 2026.">
  <title>La granjita de Emyr</title>
  <style>
    :root {
      color-scheme: light;
      --red: #e32820;
      --red-dark: #ae1712;
      --blue: #087acb;
      --blue-dark: #075890;
      --green: #159447;
      --green-dark: #087235;
      --cream: #fff6df;
      --ink: #332116;
      --shadow: 0 20px 50px rgba(48, 30, 15, .25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #dff4ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
      color: var(--ink);
      background-color: #e8f7ff;
      background-image:
        linear-gradient(90deg, rgba(56, 170, 232, .12) 50%, transparent 50%),
        linear-gradient(rgba(56, 170, 232, .12) 50%, transparent 50%);
      background-size: 44px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(12px, 2.5vw, 32px);
      position: relative;
    }

    /* Contenedor de Efectos Dinámicos */
    #fx-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    /* Estructura principal Responsive Adaptada (Mobile-First a Desktop) */
    main {
      width: 100%;
      max-width: 580px; /* Ancho perfecto en celulares y tablets compactas */
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    @media (min-width: 768px) {
      main {
        max-width: 660px; /* Escritorio: excelente tamaño para apreciar cada detalle de la invitación */
      }
    }

    .card {
      overflow: hidden;
      background: var(--cream);
      border: 4px solid rgba(255, 255, 255, .95);
      border-radius: clamp(20px, 4vw, 32px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .invitation-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: var(--cream);
    }

    .actions {
      position: relative;
      isolation: isolate;
      padding: clamp(20px, 4vw, 32px);
      text-align: center;
      background:
        radial-gradient(circle at 8% 20%, rgba(255, 205, 45, .32) 0 5px, transparent 6px),
        radial-gradient(circle at 92% 78%, rgba(255, 205, 45, .32) 0 5px, transparent 6px),
        var(--cream);
      border-top: 3px dashed rgba(197, 52, 36, .55);
    }

    .actions::before,
    .actions::after {
      content: "✿";
      position: absolute;
      top: 18px;
      z-index: -1;
      color: #f4b616;
      font-size: 1.5rem;
    }

    .actions::before { left: 20px; }
    .actions::after { right: 20px; }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--red-dark);
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--blue-dark);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      line-height: 1.1;
    }

    .intro {
      max-width: 32rem;
      margin: 0 auto 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      line-height: 1.5;
      color: var(--ink);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .button {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 2px solid rgba(255, 255, 255, .85);
      border-radius: 18px;
      color: #fff;
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      font-weight: 900;
      line-height: 1.15;
      text-decoration: none;
      box-shadow: 0 6px 0 rgba(47, 30, 17, .18), 0 10px 16px rgba(47, 30, 17, .12);
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(47, 30, 17, .18), 0 5px 10px rgba(47, 30, 17, .1);
    }

    .button:focus-visible {
      outline: 4px solid #ffd329;
      outline-offset: 3px;
    }

    .button--maps {
      background: linear-gradient(180deg, #1593e5, var(--blue));
    }

    .button--whatsapp {
      background: linear-gradient(180deg, #22b85d, var(--green));
    }

    .button-icon {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .22);
      font-size: 1.25rem;
    }

    .note {
      margin: 18px auto 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.85rem, 1.6vw, 0.92rem);
      line-height: 1.45;
      color: #654636;
    }

    .note strong {
      color: var(--red-dark);
    }

    /* Animaciones CSS de los efectos */
    @keyframes fallConfetti {
      0% { transform: translateY(-20px) rotate(0deg) scale(0.8); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg) scale(1.2); opacity: 0; }
    }

    @keyframes burstParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }

    @keyframes floatBubble {
      0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
      20% { opacity: 0.9; }
      100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
    }

    .particle {
      position: absolute;
      will-change: transform, opacity;
    }

    /* Adaptación de botones a 2 columnas en Tablets y PCs */
    @media (min-width: 560px) {
      .buttons {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
    }

    @media (hover: hover) {
      .button:hover {
        filter: brightness(1.06) saturate(1.05);
        transform: translateY(-2px);
        box-shadow: 0 8px 0 rgba(47, 30, 17, .18), 0 12px 20px rgba(47, 30, 17, .16);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
      #fx-container {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Contenedor dinámico de efectos visuales -->
  <div id="fx-container"></div>

  <main>
    <article class="card" aria-label="Invitación al cumpleaños de Emyr">
      <img
        class="invitation-image"
        src="invitacion.jpg"
        alt="Invitación de la granjita de Emyr: cumple 2 años el 26 de septiembre de 2026, de 3:00 p. m. a 6:00 p. m., en Jr. Estados Unidos 740, Jesús María."
        width="1024"
        height="1536"
      >

      <section class="actions" aria-labelledby="actions-title">
        <p class="eyebrow">La granjita te espera</p>
        <h1 id="actions-title">¡Acompáñanos a celebrar!</h1>
        <p class="intro">Abre la ruta en tu aplicación de mapas o confirma tu asistencia directamente por WhatsApp.</p>

        <div class="buttons">
          <a
            class="button button--maps"
            href="https://www.google.com/maps/search/?api=1&query=Jr.%20Estados%20Unidos%20740%2C%20Jes%C3%BAs%20Mar%C3%ADa%2C%20Lima%2C%20Per%C3%BA"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir la dirección de la fiesta en el GPS"
          >
            <span class="button-icon" aria-hidden="true">📍</span>
            <span>Cómo llegar</span>
          </a>

          <a
            class="button button--whatsapp"
            href="https://wa.me/51962883193?text=Hola%2C%20confirmo%20la%20asistencia%20al%20cumplea%C3%B1os%20de%20Emyr.%20El%20nombre%20del%20ni%C3%B1o%20o%20ni%C3%B1a%20asistente%20es%3A%20"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar asistencia al cumpleaños de Emyr por WhatsApp"
          >
            <span class="button-icon" aria-hidden="true">💬</span>
            <span>Confirmar asistencia</span>
          </a>
        </div>

        <p class="note">Al confirmar, por favor escribe el <strong>nombre del niño o niña que asistirá</strong>.</p>
      </section>
    </article>
  </main>

  <script>
    const container = document.getElementById('fx-container');
    let currentIntervals = [];

    const colors = ['#e32820', '#087acb', '#159447', '#ffcd2d', '#ffffff', '#ff7b72', '#ff9f43'];

    function clearContainer() {
      currentIntervals.forEach(interval => clearInterval(interval));
      currentIntervals = [];
      container.innerHTML = '';
    }

    // --- DISEÑO 1: Lluvia Masiva Constante de Confeti ---
    function addEffect1() {
      const interval = setInterval(() => {
        for(let i = 0; i < 2; i++) {
          const el = document.createElement('div');
          el.className = 'particle';
          
          const size = Math.floor(Math.random() * 10) + 6;
          el.style.width = size + 'px';
          el.style.height = (size * 0.5) + 'px';
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          el.style.left = Math.random() * 100 + 'vw';
          el.style.top = '-20px';
          
          const duration = Math.random() * 2 + 2;
          el.style.animation = `fallConfetti ${duration}s linear forwards`;
          
          container.appendChild(el);
          setTimeout(() => el.remove(), duration * 1000);
        }
      }, 90);
      currentIntervals.push(interval);
    }

    // --- DISEÑO 2: Múltiples Explosiones Cíclicas Grandes y Masivas ---
    function triggerMultipleBursts() {
      const burstCount = Math.floor(Math.random() * 2) + 2; 
      
      for(let b = 0; b < burstCount; b++) {
        const originX = Math.random() * 90 + 5; 
        const originY = Math.random() * 70 + 10; 
        const particleCount = 45; 

        for (let i = 0; i < particleCount; i++) {
          const el = document.createElement('div');
          el.className = 'particle';
          el.style.left = originX + 'vw';
          el.style.top = originY + 'vh';
          
          const size = Math.floor(Math.random() * 8) + 5;
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          el.style.borderRadius = '50%';

          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 250 + 100; 
          const dx = Math.cos(angle) * distance;
          const dy = Math.sin(angle) * distance;

          el.style.setProperty('--dx', dx + 'px');
          el.style.setProperty('--dy', dy + 'px');

          const duration = Math.random() * 0.6 + 0.8;
          el.style.animation = `burstParticle ${duration}s ease-out forwards`;

          container.appendChild(el);
          setTimeout(() => el.remove(), duration * 1000);
        }
      }
    }

    function addEffect2() {
      triggerMultipleBursts();
      const interval = setInterval(triggerMultipleBursts, 900);
      currentIntervals.push(interval);
    }

    // --- DISEÑO 3: Lluvia Intensa de Burbujas y Destellos de Granjita ---
    function addEffect3() {
      const interval = setInterval(() => {
        for(let i = 0; i < 2; i++) {
          const el = document.createElement('div');
          el.className = 'particle';
          
          const size = Math.floor(Math.random() * 16) + 10;
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.border = '2px solid rgba(255, 255, 255, 0.9)';
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          el.style.opacity = '0.8';
          el.style.borderRadius = '50%';
          el.style.left = Math.random() * 100 + 'vw';
          
          const duration = Math.random() * 2.5 + 2;
          el.style.animation = `floatBubble ${duration}s ease-in-out forwards`;
          
          container.appendChild(el);
          setTimeout(() => el.remove(), duration * 1000);
        }
      }, 150);
      currentIntervals.push(interval);
    }

    // Inicializar todos los efectos combinados al cargar la página
    function initAllEffects() {
      clearContainer();
      addEffect1();
      addEffect2();
      //addEffect3();
    }

    initAllEffects();
  </script>
</body>
</html>
